name: Al-La'eeb K8s Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target cluster
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    # Runs only when the staging kubeconfig secret exists (user infrastructure).
    if: ${{ inputs.target == 'staging' && secrets.STAGING_KUBECONFIG != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.28.0"
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy to staging
        run: |
          kubectl apply -k infrastructure/k8s/overlays/staging/
          kubectl rollout status deployment/api-gateway -n allaeeb --timeout=300s

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    # Runs only on version tags when the production kubeconfig secret exists.
    if: ${{ inputs.target == 'production' && secrets.PROD_KUBECONFIG != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.28.0"
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.PROD_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy to production
        run: |
          kubectl apply -k infrastructure/k8s/overlays/production/
          kubectl rollout status deployment/api-gateway -n allaeeb --timeout=600s
      - name: Verify deployment
        run: |
          kubectl get pods -n allaeeb
          kubectl get svc -n allaeeb
