version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: allaeeb-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_DB: allaeeb
      POSTGRES_USER: allaeeb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allaeeb-secure-password-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allaeeb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - allaeeb-network

  redis:
    image: redis:7-alpine
    container_name: allaeeb-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis-secure-password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - allaeeb-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: allaeeb-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - allaeeb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.auth
    container_name: allaeeb-auth
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://allaeeb:${POSTGRES_PASSWORD:-allaeeb-secure-password-change-me}@postgres:5432/allaeeb
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis-secure-password}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - allaeeb-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  player-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.player
    container_name: allaeeb-player
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://allaeeb:${POSTGRES_PASSWORD:-allaeeb-secure-password-change-me}@postgres:5432/allaeeb
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis-secure-password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - allaeeb-network

  ai-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: allaeeb-ai
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /models
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis-secure-password}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - MAX_UPLOAD_SIZE_MB=2048
      - VIDEO_PROCESSING_TIMEOUT=240
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - qdrant
    networks:
      - allaeeb-network

  nlp-coach:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.nlp
    container_name: allaeeb-nlp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis-secure-password}
      - ENVIRONMENT=production
    depends_on:
      - redis
    networks:
      - allaeeb-network

  scout-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.scout
    container_name: allaeeb-scout
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis-secure-password}
    depends_on:
      - qdrant
      - redis
    networks:
      - allaeeb-network

  video-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.video
    container_name: allaeeb-video
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /uploads
    ports:
      - "127.0.0.1:8006:8006"
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=allaeeb-videos
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
    networks:
      - allaeeb-network

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.gateway
    container_name: allaeeb-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis-secure-password}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://allaeeb.com}
      - ENVIRONMENT=production
    depends_on:
      - auth-service
      - player-service
      - ai-engine
      - nlp-coach
      - scout-service
      - video-service
    networks:
      - allaeeb-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: allaeeb-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - allaeeb-network

  prometheus:
    image: prom/prometheus:latest
    container_name: allaeeb-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - allaeeb-network

  grafana:
    image: grafana/grafana:latest
    container_name: allaeeb-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
    networks:
      - allaeeb-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  allaeeb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
