name: allaeeb
description: Al-La'eeb - AI Football Talent Intelligence Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  flutter_bloc: ^8.1.0
  equatable: ^2.0.0
  dio: ^5.4.0
  retrofit: ^4.0.0
  json_annotation: ^4.8.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.0
  video_player: ^2.8.0
  chewie: ^1.7.0
  fl_chart: ^0.66.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  intl: ^0.18.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.3.0
  flutter_launcher_icons: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  retrofit_generator: ^8.0.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0A0E21"
  image: assets/images/splash_logo.png
  android: true
  ios: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
